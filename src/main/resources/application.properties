spring.application.name=order

spring.datasource.url=jdbc:postgresql://localhost:5432/orderTest
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-group
spring.kafka.consumer.auto-offset-reset=earliest

# Proper error handling
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Allow cross-package deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Fix header mismatch by mapping old class name to new one
spring.kafka.consumer.properties.spring.json.type.mapping=com.example.cart.events.CartCheckoutEvent:com.example.order.events.CartCheckoutEvent

